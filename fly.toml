app = "ivorygrimymozbot" # Change this to your preferred unique app name
primary_region = "iad" # Change to your nearest region (e.g., 'ewr', 'lax', 'lhr', 'fra')

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[mounts]
  source = "app_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
